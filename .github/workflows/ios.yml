name: iPhone app

# Builds the App Store app (the native/ folder) on one of GitHub's Macs, so nobody needs a Mac of their own.
#
# simulator-build: on every push that changes native/ or this file. Compiles for the iPhone simulator, unsigned.
#   Needs no Apple account; only proves the project still builds.
# testflight: builds a signed copy and uploads it to App Store Connect, where it appears in TestFlight.
#   Started by pushing a tag named testflight-<anything> (Claude does this), or by hand once this file is on
#   the main branch: Actions tab > iPhone app > Run workflow > tick "Upload to TestFlight".
#   Needs four repository secrets (Settings > Secrets and variables > Actions):
#     ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole .p8 file), APPLE_TEAM_ID. See native/APP-STORE.md.
#   The build number is the workflow run number, so every upload is numbered higher than the one before.
on:
  push:
    branches: ['**']
    tags: ['testflight-*']
    paths:
      - 'native/**'
      - '!native/screenshots/**'
      - '!native/scripts/screenshots.js'
      - '!native/**/*.md'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

jobs:
  simulator-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.testflight) }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the live game into the app
        working-directory: native
        run: npm ci && npm run sync
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for the iPhone simulator
        working-directory: native/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  testflight:
    if: ${{ startsWith(github.ref, 'refs/tags/testflight-') || (github.event_name == 'workflow_dispatch' && inputs.testflight) }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Apple secrets are set
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          [ $missing = 0 ] || exit 1
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::ASC_KEY_P8 must be the whole .p8 file, including the BEGIN and END lines"; exit 1; }
      - name: Package the live game into the app
        working-directory: native
        run: npm ci && npm run sync
      - name: Xcode version
        run: xcodebuild -version
      - name: Build the app (unsigned archive; it is signed in the next step)
        working-directory: native/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive"
          CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGNING_ALLOWED=NO archive
      - name: Sign with Apple's cloud certificate and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect > TestFlight after Apple processes it (often 5 to 30 minutes)."
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
