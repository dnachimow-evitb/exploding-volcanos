name: Relay

# Deploys the Multiplayer relay (relay/) to Cloudflare. Needs two repository secrets that only Derek can add:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Until both exist this job does nothing and says so.
on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: relay-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare keys are set
        id: keys
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "### Relay not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'yes'
        with:
          node-version: 22
      - name: Deploy
        if: steps.keys.outputs.ready == 'yes'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail   # without this a failed deploy still showed as a green run (it did, on 2026-11-23)
          # a secret pasted with a stray space or line break is refused by Cloudflare: strip them
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx --yes wrangler@4.164.0 deploy 2>&1 | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1 || true)
          echo "### Relay deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Address: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
