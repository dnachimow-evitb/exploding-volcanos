<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
<title>Exploding Volcanoes (TEST)</title>
<meta name="theme-color" content="#2a6fdb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Volcanoes Test" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-test.png" />
<style>
  /* fable-v5: self-contained page (no shared stylesheet, no service worker, no network) */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;overflow:hidden;background:#2a6fdb;overscroll-behavior:none;}
  body{display:flex;align-items:center;justify-content:center;touch-action:none;position:fixed;inset:0;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  #w{position:relative;overflow:hidden;}
  #w.boxed{border-radius:16px;box-shadow:0 12px 44px rgba(0,0,0,.5);}
  body:has(#w.boxed){background:radial-gradient(ellipse at 50% 35%,#1b4a78 0%,#0d2740 60%,#07182a 100%);}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  /* probes: the script reads the notch and home-indicator insets from these */
  #safe,#safeb{position:fixed;left:0;width:1px;visibility:hidden;pointer-events:none;}
  #safe{top:0;height:env(safe-area-inset-top);}
  #safeb{bottom:0;height:env(safe-area-inset-bottom);}
</style>
</head>
<body>
<!-- TEST PAGE. Loads game-test.js, the working copy where changes are tried first. It is NOT the live game
     (index.html loads game-fable-v7.js), registers no service worker, and keeps its own saved players and badges.
     README.txt, "TEST COPY", explains how a tested change is published. -->
<div id="safe"></div><div id="safeb"></div>
<div id="w"><canvas id="c" width="380" height="600"></canvas></div>
<audio id="song" src="song.mp3" loop preload="auto"></audio>
<script>
// Always run the newest test build. Phones (the home-screen app most of all) keep an old saved copy of this
// page for a long time, and a fixed game-test.js?v=N address in that old copy pinned them to an old game.
// So the game file is asked for under a new address on every open, which no saved copy can match.
(function(){
  var s=document.createElement('script');s.src='game-test.js?t='+Date.now();document.body.appendChild(s);
  // Coming back to an app that was left open: if a newer build has been published, reload (start screen only,
  // so a game in progress is never interrupted).
  var busy=false;
  function check(){
    if(busy||document.visibilityState!=='visible'||typeof VERSION==='undefined')return;busy=true;
    fetch('game-test.js?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
      var m=t.match(/const VERSION='([^']+)'/);
      if(m&&m[1]!==VERSION&&state==='menu')location.replace('play-test.html?t='+Date.now());
    }).catch(function(){}).then(function(){busy=false;});
  }
  document.addEventListener('visibilitychange',check);window.addEventListener('pageshow',function(e){if(e.persisted)check();});
})();
</script>
</body>
</html>
